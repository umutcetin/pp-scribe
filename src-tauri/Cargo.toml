[package]
name = "pp-scribe"
version = "0.1.0"
description = "Meeting transcription: live captions + accurate post-meeting transcript"
authors = ["Umut Cetin"]
edition = "2021"

[lib]
name = "pp_scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio (cpal >= 0.17 adds macOS system-audio loopback via CoreAudio process taps)
cpal = "0.18.2"
rubato = "0.16.2"
hound = "3.5.1"
rustfft = "6.4.0"

# Speech-to-text
transcribe-rs = "0.1.4"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }

# Model downloads
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
flate2 = "1"
tar = "0.4"

# Knowledge base (local RAG)
rusqlite = { version = "0.40", features = ["bundled"] }
ort = "=2.0.0-rc.10"
ndarray = "0.16"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
dom_smoothie = "0.18"
htmd = "0.5"
sha2 = "0.10"
regex = "1"
tauri-plugin-dialog = "2"

# Utilities
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
